schemaVersion: 2
name: loadtest-container-jvm

registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: loadtest-container-jvm

controlPlane:
  modules: [container-deployment-provider, autoscaler, async-queue, build-metadata]
  build:
    mode: jvm
    variant: loadtest-container-jvm
  jvm:
    args: ["-XX:+UseSerialGC"]
  container:
    image: control-plane
  config:
    nanofaas:
      deployment:
        default-backend: container-local
      metrics:
        profile: advanced

functions:
  - name: word-stats
    sdk: java
    build:
      mode: jvm
    container:
      image: word-stats-java
