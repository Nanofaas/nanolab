# Short, non-qualifying diagnostic spike for control-plane native memory.
workflow: soak
backend: container
functions:
  - word-stats-java
  - word-stats-javascript
resources:
  control-plane:
    limits: {cpu: 2, memoryMiB: 1024}
  word-stats-java:
    limits: {cpu: 2, memoryMiB: 1024}
  word-stats-javascript:
    limits: {cpu: 1, memoryMiB: 512}
soak:
  # Short and explicitly non-qualifying, so `p24`'s three-retention-cycle
  # rule does not apply: every criterion below already says so.
  purpose: smoke
  metrics_profile: soak
  phases:
    warmup_s: 120
    baseline_drain_s: 420
    baseline_window_s: 120
    steady_s: 900
    drain_s: 420
    cleanup_margin_s: 120
  # The platform's own retention, which preflight compares against what the
  # control plane reports. Retention is an operator-side property, not a knob a
  # scenario turns: nothing in the deployment applies these values, so declaring
  # anything but what the platform runs fails preflight by design.
  retention_s:
    unkeyed-sync-outcome: 30
    terminal-key-and-readable-outcome: 300
    live-key-and-execution: 1800
  roles:
    control-plane:
      runtime: jvm
      expected_cpu: 2
      memory_limit_bytes: 1073741824
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes, jvm_memory_used_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: [-XX:NativeMemoryTracking=summary]
      collection_sources: [procfs, docker-engine, prometheus]
    word-stats-java:
      runtime: jvm
      expected_cpu: 2
      memory_limit_bytes: 1073741824
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes, jvm_memory_used_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: []
      collection_sources: [procfs, docker-engine, prometheus]
    word-stats-javascript:
      runtime: node
      expected_cpu: 1
      memory_limit_bytes: 536870912
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: []
      collection_sources: [procfs, docker-engine]
  images:
    control-plane:
      mode: build
      variant: jvm
      platform: linux/arm64
      modules: [container-deployment-provider, async-queue, build-metadata]
      build_options: {}
    word-stats-java:
      mode: build
      variant: jvm
      platform: linux/arm64
      modules: []
      build_options: {}
    word-stats-javascript:
      mode: build
      variant: default
      platform: linux/arm64
      modules: []
      build_options: {}
  criteria:
    - id: control-plane.diagnostic-cgroup-budget
      role: control-plane
      metric: cgroup_memory_usage_bytes
      label_selector: {}
      unit: bytes
      operation: maximum
      phase: steady
      window_s: 900
      threshold: 1073741824
      rationale: Diagnostic guard only; this spike does not qualify P24.
    - id: control-plane.diagnostic-rss-return
      role: control-plane
      metric: process_rss_bytes
      label_selector: {}
      unit: bytes
      operation: return_to_reference
      phase: drain
      window_s: 120
      deadline_s: 420
      absolute_tolerance: 0
      relative_tolerance: 0
      rationale: Preserve the strict natural-recovery observation during the spike.
    - id: word-stats-java.diagnostic-cgroup-budget
      role: word-stats-java
      metric: cgroup_memory_usage_bytes
      label_selector: {}
      unit: bytes
      operation: maximum
      phase: steady
      window_s: 900
      threshold: 1073741824
      rationale: Diagnostic guard only; this spike does not qualify P24.
    - id: word-stats-java.diagnostic-rss-return
      role: word-stats-java
      metric: process_rss_bytes
      label_selector: {}
      unit: bytes
      operation: return_to_reference
      phase: drain
      window_s: 120
      deadline_s: 420
      absolute_tolerance: 0
      relative_tolerance: 0
      rationale: Preserve the strict natural-recovery observation during the spike.
    - id: word-stats-javascript.diagnostic-cgroup-budget
      role: word-stats-javascript
      metric: cgroup_memory_usage_bytes
      label_selector: {}
      unit: bytes
      operation: maximum
      phase: steady
      window_s: 900
      threshold: 536870912
      rationale: Diagnostic guard only; this spike does not qualify P24.
    - id: word-stats-javascript.diagnostic-rss-return
      role: word-stats-javascript
      metric: process_rss_bytes
      label_selector: {}
      unit: bytes
      operation: return_to_reference
      phase: drain
      window_s: 120
      deadline_s: 420
      absolute_tolerance: 0
      relative_tolerance: 0
      rationale: Preserve the strict natural-recovery observation during the spike.
  diagnostics:
    operations:
      # Order is meaning here: operations run as declared, so reading the diff
      # after `gc` would include that full GC's own reclamation in the delta and
      # it would no longer be the growth over steady + drain.
      control-plane: [native_memory_diff, native_memory, gc]
    # The mark the diff is measured from, taken once the baseline window closed.
    # Read Native Memory Tracking where the flag above actually produces it.
    baseline_operations:
      control-plane: [native_memory_baseline]
    timeout_s: 120
    max_dumps: 1
    max_dump_bytes: 1073741824
    # Built per run; see the candidate preset for why no digest lives here.
    executables:
      control-plane: [jcmd]
    gc_completion_evidence:
      control-plane: jdk.GarbageCollection
  prerequisites:
    mode: run
    required_coverage:
      - sync
    relevant_config_keys:
      sync: [images, roles, retention_s, workload]
    receipts: {}
  sample_interval_s: 10
  scrape_timeout_s: 3
  max_observation_gap_s: 30
  artifact_limit_bytes: 2147483648
  cancellation_timeout_s: 30
  workload:
    rates:
      word-stats-java: 100
      word-stats-javascript: 100
    preallocated_vus: 200
    max_vus: 200
    max_error_ratio: 0
    max_dropped_iterations: 0
