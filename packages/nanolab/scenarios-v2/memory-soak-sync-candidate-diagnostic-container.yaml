# Candidate-only diagnostic: one NanoFaaS version with SOAK ownership metrics.
# Single source snapshot; build every application role before measurement.
# The checked-in criteria-only policy freezes the approved P24 RSS contract.
# Profile-aware prerequisite settlement supplies only applicable owner gates.
workflow: soak
backend: container
soakPolicyFile: ./memory-soak-policy.yaml
functions:
  - word-stats-java
  - word-stats-javascript
resources:
  control-plane:
    limits: {cpu: 2, memoryMiB: 1024}
  word-stats-java:
    limits: {cpu: 2, memoryMiB: 1024}
  word-stats-javascript:
    limits: {cpu: 1, memoryMiB: 512}
soak:
  purpose: p24
  metrics_profile: soak
  phases:
    warmup_s: 120
    baseline_drain_s: 2100
    baseline_window_s: 120
    steady_s: 5400
    drain_s: 2100
    cleanup_margin_s: 300
  # Intended owner settings from NanoFaaS outcome/idempotency policy.
  # Effective runtime values must be observed; this mapping does not set them.
  retention_s:
    unkeyed-sync-outcome: 30
    terminal-key-and-readable-outcome: 300
    live-key-and-execution: 1800
  roles:
    control-plane:
      runtime: jvm
      expected_cpu: 2
      memory_limit_bytes: 1073741824
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes, jvm_memory_used_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: []
      collection_sources: [procfs, docker-engine, prometheus]
    word-stats-java:
      runtime: jvm
      expected_cpu: 2
      memory_limit_bytes: 1073741824
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes, jvm_memory_used_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: []
      collection_sources: [procfs, docker-engine, prometheus]
    word-stats-javascript:
      runtime: node
      expected_cpu: 1
      memory_limit_bytes: 536870912
      required_metrics: [process_rss_bytes, process_pss_bytes, cgroup_memory_usage_bytes]
      required_capabilities: [procfs, docker-engine]
      runtime_options: [--require=/opt/nanolab/node-diagnostic-control.cjs]
      collection_sources: [procfs, docker-engine]
  images:
    control-plane:
      mode: build
      variant: jvm
      platform: linux/arm64
      modules: [container-deployment-provider, async-queue, build-metadata]
      build_options: {}
    word-stats-java:
      mode: build
      variant: jvm
      platform: linux/arm64
      modules: []
      build_options: {}
    word-stats-javascript:
      mode: build
      variant: default
      platform: linux/arm64
      modules: []
      build_options: {}
  criteria: []
  diagnostics:
    # Required operations are not proof of available, compatible helpers.
    # Native deliberately has no implicit JVM command or invented helper image.
    operations:
      control-plane: [gc, heap_dump]
      word-stats-java: [gc, heap_dump]
      word-stats-javascript: [gc, heap_dump]
    timeout_s: 120
    max_dumps: 3
    max_dump_bytes: 3221225472
    helper_images:
      control-plane: localhost:5000/nanolab/p24-diagnostic-helper@sha256:5ac642accc637de4f0a5621d0804cc5ab784880186f90ea159c1edbd9f7d02ce
      word-stats-java: localhost:5000/nanolab/p24-diagnostic-helper@sha256:5ac642accc637de4f0a5621d0804cc5ab784880186f90ea159c1edbd9f7d02ce
      word-stats-javascript: localhost:5000/nanolab/p24-diagnostic-helper@sha256:5ac642accc637de4f0a5621d0804cc5ab784880186f90ea159c1edbd9f7d02ce
    executables:
      control-plane: [jcmd]
      word-stats-java: [jcmd]
    gc_completion_evidence:
        control-plane: jdk.GarbageCollection
        word-stats-java: jdk.GarbageCollection
        word-stats-javascript: node:perf_hooks:major-gc
  prerequisites:
    mode: run
    required_coverage:
      - sync
    relevant_config_keys:
      sync: [images, roles, retention_s, workload]
    receipts: {}
  sample_interval_s: 10
  scrape_timeout_s: 3
  max_observation_gap_s: 30
  artifact_limit_bytes: 8589934592
  cancellation_timeout_s: 30
  workload:
    # Explicit initial rates; validate actual offered work and capacity in preflight.
    rates:
      word-stats-java: 100
      word-stats-javascript: 100
    preallocated_vus: 200
    max_vus: 200
    max_error_ratio: 0
    max_dropped_iterations: 0
