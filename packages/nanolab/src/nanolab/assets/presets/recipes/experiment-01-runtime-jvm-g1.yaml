schemaVersion: 2
name: experiment-01-runtime-jvm-g1
registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: comparison
controlPlane:
  modules:
  - k8s-deployment-provider
  - async-queue
  - build-metadata
  build:
    mode: jvm
    variant: jvm-g1
  container:
    image: experiment-01-runtime-jvm-g1
  jvm:
    args:
    - -XX:+UseG1GC
    - -Xmx64m
    - -XX:TieredStopAtLevel=1
