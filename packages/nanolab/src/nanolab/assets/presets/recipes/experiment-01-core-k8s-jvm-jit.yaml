schemaVersion: 2
name: experiment-01-core-k8s-jvm-jit
registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: experiment-01
controlPlane:
  modules:
  - k8s-deployment-provider
  - build-metadata
  build:
    mode: jvm
  container:
    image: control-plane-e01-jvm-jit
  jvm:
    args:
    - -XX:+UseSerialGC
    - -Xmx64m
functions:
- name: qr-code
  sdk: rust
  container:
    image: rust-qr-code
