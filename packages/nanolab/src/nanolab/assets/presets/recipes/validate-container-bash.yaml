schemaVersion: 2
name: validate-container-bash

registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: recipe-v2-bash

controlPlane:
  modules: [container-deployment-provider, build-metadata]
  build:
    mode: jvm
    variant: recipe-v2-bash
  jvm:
    args: ["-XX:+UseSerialGC", "-Xmx256m"]
  container:
    image: control-plane
  config:
    nanofaas:
      deployment:
        default-backend: container-local
      metrics:
        profile: advanced

functions:
  - name: word-stats
    sdk: bash
    container:
      image: bash-word-stats
