    image: javascript-roman-numeral
- name: word-stats
  sdk: javascript
  container:
    image: javascript-word-stats
- name: handler-envelope
  sdk: python
  container:
    image: python-handler-envelope
- name: json-transform
  sdk: python
  container:
    image: python-json-transform
- name: mlimage
  sdk: python
  container:
    image: python-mlimage
- name: qr-code
  sdk: python
  container:
    image: python-qr-code
- name: roman-numeral
  sdk: python
