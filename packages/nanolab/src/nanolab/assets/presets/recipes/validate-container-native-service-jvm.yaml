schemaVersion: 2
name: validate-container-native-service-jvm
registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: recipe-v2-native-service-jvm
controlPlane:
  modules:
  - container-deployment-provider
  - build-metadata
  build:
    mode: native
    builder: container
    variant: recipe-v2-native-service-jvm
  container:
    image: control-plane
  config:
    nanofaas:
      deployment:
        default-backend: container-local
      metrics:
        profile: advanced
functions:
- name: word-stats
  sdk: java
  build:
    mode: jvm
  container:
    image: word-stats-java
services:
- name: warm-echo
  sdk: java
  build:
    mode: jvm
  container:
    image: warm-echo-java
