schemaVersion: 2
name: comparison-jvm-c2-loop1
registry:
  repository: 127.0.0.1:5000/nanofaas
  tag: comparison
controlPlane:
  modules:
  - k8s-deployment-provider
  - async-queue
  - build-metadata
  build:
    mode: jvm
    variant: jvm-c2-loop1
  container:
    image: control-plane-jvm-c2-loop1
  jvm:
    args:
    - -XX:+UseSerialGC
    - -Dreactor.netty.ioWorkerCount=1
