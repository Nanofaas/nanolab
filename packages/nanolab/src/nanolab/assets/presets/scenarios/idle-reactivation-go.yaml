workflow: idle-reactivation
backend: k8s
build: docker
functions:
- word-stats-go
idleReactivation:
  cycles: 3
  idleSeconds: 180
  zeroFirst: false
resources:
  control-plane:
    requests:
      cpu: 0.25
      memoryMiB: 512
    limits:
      cpu: 2
      memoryMiB: 2048
  word-stats-go:
    requests:
      cpu: 1
      memoryMiB: 256
    limits:
      cpu: 2
      memoryMiB: 512
