# Esperimento 01, pilot: costo del control plane davanti a una sola qr-code-rust.
#
# Eseguito da `compare` con le sette chiavi experiment-01-* e una ripetizione.
# Il calendario e' breve e provvisorio: il pilot serve a verificare composizioni,
# flag effettivi, generatore e attraversamento del sovraccarico, e a scegliere le
# soglie di fedelta' del generatore. Per questo `status: pilot` puo' lasciarle
# aperte, e nessun gradino del pilot viene qualificato come erogato.
#
# Nessuno di questi valori e' un asse della matrice: ogni cella invia lo stesso
# payload sullo stesso calendario. Heap massimo 64 MiB in ogni runtime (fissato
# nelle recipe, non qui); i limiti container sotto sono identici per tutte le celle
# e distinti dall'heap.
workflow: loadtest
backend: k8s
loadProfile: experiment-01
functions:
  - qr-code-rust
resources:
  control-plane:
    requests:
      cpu: 1
      memoryMiB: 512
    limits:
      cpu: 1
      memoryMiB: 512
  qr-code-rust:
    requests:
      cpu: 1
      memoryMiB: 256
    limits:
      cpu: 1
      memoryMiB: 256
experiment01:
  status: pilot
  # Testo ASCII deterministico ("A" x 1024) e size 1024, byte JSON canonici.
  payloadFile: experiment-01-qr-1024.json
  payloadSha256: 75939ab38335f301b61cc12d7aada34d95fee21cbc44757a42383366a7104aa7
  idleSeconds: 60
  warmup:
    rate: 20
    durationSeconds: 60
  steps:
    - {rate: 25, durationSeconds: 60}
    - {rate: 50, durationSeconds: 60}
    - {rate: 100, durationSeconds: 60}
    - {rate: 200, durationSeconds: 60}
  httpTimeoutSeconds: 30
  completionMarginSeconds: 10
  gracefulStopSeconds: 40
  drainSeconds: 60
  fixedConcurrency: 2
  queueCapacity: 200
  preAllocatedVUs: 100
  maxVUs: 6000
  criteria:
    latencyThresholdMs: 1000
    minWithinThresholdFraction: 0.99
    maxPendingFraction: 0.01
