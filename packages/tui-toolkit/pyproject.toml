[project]
name = "tui-toolkit"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Reusable terminal UI widgets and workflow event renderer with a unified theme model."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.8",
    "questionary>=2.1.1",
    "prompt-toolkit>=3.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tui_toolkit = ["py.typed"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pydeps>=3.0.6",
    "pytest>=8.3.4",
    "pytest-cov>=6.0",
    # Pinned exactly to match the ruff-pre-commit revision in
    # .pre-commit-config.yaml. A newer ruff in either place makes the hook and a
    # local `ruff check` disagree about what a violation is. Bump both together.
    "ruff==0.16.6",
    "bandit>=1.8",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage threshold lives in [tool.coverage.report] and is deliberately not
# repeated as --cov-fail-under here: stating it twice is how the two come to
# disagree, with the command-line flag silently winning.
addopts = "-q --cov=tui_toolkit --cov-config=packages/tui-toolkit/pyproject.toml --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/tui_toolkit/pickers.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

# =============================================================================
# Ruff - linting + formatting
# =============================================================================
# Same rule set as the sibling projects; SLF is kept because this package
# already relied on it.

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self - private member access
    "TID",   # flake8-tidy-imports
    "RUF",   # Ruff-specific rules
    "PERF",  # Perflint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate - commented-out code
    "D",     # pydocstyle - this is a published package with a public API
]
ignore = [
    "D203",
    "D213",
    "PT018",
]

[tool.ruff.lint.isort]
known-first-party = ["tui_toolkit"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F841",
    "F401",
    "SLF001",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
]
"src/tui_toolkit/console.py" = ["SLF001"]
"src/tui_toolkit/pickers.py" = ["SLF001"]

# =============================================================================
# basedpyright - type checking
# =============================================================================
# reportImplicitOverride is left off because typing.override requires 3.12 and
# this package supports 3.11 (see the same note in shellcraft and proxmox-sdk).

[tool.basedpyright]
include = ["src/tui_toolkit"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateUsage = false
venvPath = "../.."
venv = ".venv"

# =============================================================================
# Bandit - security static analysis
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B404",
    "B603",
    "B607",
]
